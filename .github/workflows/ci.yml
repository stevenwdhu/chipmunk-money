name: CI

# The checks run when code changes: on main, on pull requests, and always for a release tag (tag pushes
# skip the path filter). Docs, the README, screenshots and the Dockerfile alone don't run anything.
# docs/api.md and docs/mcp.md are in the list because a test checks they match the code.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - 'docs/api.md'
      - 'docs/mcp.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'vitest.config.ts'
      - 'docs/api.md'
      - 'docs/mcp.md'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    # A release pushes main and its tag together, two runs of the same commit. The tag's run checks it
    # (and publishes the image), so main's run of a release commit is skipped.
    if: ${{ !(github.event_name == 'push' && github.ref_type == 'branch' && startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Its own pnpm cache runs before pnpm is installed (below), so the store is cached by hand.
          package-manager-cache: false
      # pnpm comes from packageManager in package.json
      - run: corepack enable
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # A release: after the checks pass on a version tag (v0.1.0), the image for amd64 and arm64 (Apple
  # silicon, Raspberry Pi) on GitHub's registry as ghcr.io/<owner>/spending-tracker:0.1.0, :0.1 and :latest.
  # The image is built only here: pushes to main and pull requests only run the checks.
  # docs/releasing.md says how a release is made.
  publish:
    name: Publish image
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # The tag is the version in package.json, or nothing is published.
      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match package.json's version $version"
            exit 1
          fi
      # arm64 is built under emulation: slower, but the same Dockerfile.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Fails if data, secrets or .env files would reach the build context
      - name: Check the build context
        run: docker buildx build --target context-check .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
